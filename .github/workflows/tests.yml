name: tests

on:
  push:
  pull_request:

jobs:
  stdlib:
    # Python 3.9 binaries are available on 24.04, not on the latest 26.04 image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Contract text and Word reader
        run: |
          python .agents/skills/hetong-craft/scripts/test_hetong_redline.py
          python .agents/skills/hetong-craft/scripts/test_word_reader.py
          python .agents/skills/hetong-craft/scripts/test_review_audit.py
          python .agents/skills/hetong-craft/scripts/test_platform_compat.py
          python .agents/skills/hetong-craft/scripts/test_hidden_change.py
          python .agents/skills/hetong-craft/scripts/test_buyer_clause_select.py
          python .agents/skills/hetong-craft/scripts/test_clause_library.py
          python .agents/skills/hetong-craft/scripts/test_hetong_intake.py
          python .agents/skills/hetong-craft/scripts/test_intake_redline.py
          python .agents/skills/hetong-review/scripts/test_review_kit.py
          python scripts/test_build_workbuddy.py

  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install python-docx
      - name: XQY report and paired delivery
        run: |
          python .agents/skills/hetong-fast-xqy-v1/scripts/test_build_report.py
          python .agents/skills/hetong-fast-xqy-v1/scripts/test_build_bundle.py

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract text, Word reader and platform helpers
        shell: pwsh
        run: |
          python .agents/skills/hetong-craft/scripts/test_hetong_redline.py
          python .agents/skills/hetong-craft/scripts/test_word_reader.py
          python .agents/skills/hetong-craft/scripts/test_review_audit.py
          python .agents/skills/hetong-craft/scripts/test_platform_compat.py
          python .agents/skills/hetong-craft/scripts/test_hidden_change.py
          python .agents/skills/hetong-craft/scripts/test_buyer_clause_select.py
          python .agents/skills/hetong-craft/scripts/test_clause_library.py
          python .agents/skills/hetong-craft/scripts/test_hetong_intake.py
          python .agents/skills/hetong-craft/scripts/test_intake_redline.py
          python .agents/skills/hetong-review/scripts/test_review_kit.py
          python scripts/test_build_workbuddy.py
      - name: PowerShell installer smoke test
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "hetong-install-test"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          ./scripts/install.ps1 -Target $target
          $skills = Join-Path $target ".agents\skills"
          Get-ChildItem -LiteralPath $skills -Recurse -File |
            Select-Object -First 12 -ExpandProperty FullName
          $skill = Join-Path $skills "hetong-craft\SKILL.md"
          if (-not (Test-Path -LiteralPath $skill)) {
            throw "Installed skill missing: $skill"
          }

  windows-office:
    # Actual Windows 11 host; x64 Python/LibreOffice run under its x64 compatibility layer.
    # The separate windows job retains native x64 core-script coverage.
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - name: Record Windows font inventory
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName,OsVersion,OsArchitecture | Format-List
          Get-Item "$env:WINDIR\Fonts\simsun.ttc", "$env:WINDIR\Fonts\simhei.ttf" -ErrorAction SilentlyContinue | Select-Object Name,Length
          # Do not modify Windows Update policy or rely on a FOD download in CI.
          # The strict setup must reject a report rendered without its required fonts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install official LibreOffice MSI with checksum verification
        shell: pwsh
        run: |
          # URL and hash from microsoft/winget-pkgs 26.8.2.2 manifest.
          $msi = Join-Path $env:RUNNER_TEMP 'LibreOffice.msi'
          Invoke-WebRequest 'https://download.documentfoundation.org/libreoffice/stable/26.8.2/win/x86_64/LibreOffice_26.8.2_Win_x86-64.msi' -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne 'FF4B911403B67EE9E6249F820F9782C44BB32C94FDAA45B0DA53A8E419E5307A') {
            throw 'LibreOffice installer checksum mismatch'
          }
          $installed = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', 'ALLUSERS=1') -Wait -PassThru
          if ($installed.ExitCode -notin @(0,3010)) { throw "MSI install failed: $($installed.ExitCode)" }
      - name: PowerShell 5.1 runtime, rendering and strict missing-font guard
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $venv = Join-Path $env:RUNNER_TEMP 'hetong runtime\venv'
          foreach ($mode in @('setup','check')) {
            $output = Join-Path $env:RUNNER_TEMP "hetong-win11-$mode\合同 环境"
            $arguments = @('-NoProfile','-ExecutionPolicy','Bypass','-File','.agents\skills\hetong-craft\scripts\setup_windows.ps1','-PythonExecutable',$python,'-Venv',$venv,'-OutputDirectory',$output)
            if ($mode -eq 'check') { $arguments += '-CheckOnly' }
            & powershell.exe @arguments
            $code = $LASTEXITCODE
            $result = Get-Content -Raw -LiteralPath (Join-Path $output 'setup-result.json') | ConvertFrom-Json
            $doctor = Get-Content -Raw -LiteralPath (Join-Path $output 'doctor.json') | ConvertFrom-Json
            $smoke = Get-Content -Raw -LiteralPath (Join-Path $output 'Word样张\smoke-result.json') | ConvertFrom-Json
            if ($result.setup_performed -ne ($mode -eq 'setup')) { throw 'Unexpected dependency setup in check-only mode' }
            if (-not $doctor.ok -or -not $smoke.synthetic_only -or -not $smoke.source_unchanged -or -not $smoke.redline_verified -or $smoke.rendered_documents -ne 3) { throw 'Runtime or document checks failed' }
            foreach ($name in @('insertions','deletions','comments')) {
              if ($smoke.native_marks.$name -ne 1) { throw "Unexpected native mark count: $name" }
            }
            if (-not $smoke.required_report_fonts.'宋体') { throw 'Expected base SimSun font missing from report' }
            if ($smoke.required_report_fonts.'黑体') {
              if ($code -ne 0 -or -not $result.ok -or -not $smoke.ok) { throw 'Full-font setup must pass' }
              "$mode : runtime and required-font acceptance passed" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            } else {
              if ($code -eq 0 -or $result.ok -or $smoke.ok -or $smoke.error_code -ne 'required_report_fonts_missing') { throw 'Missing SimHei must be rejected explicitly' }
              Write-Warning 'Runtime verified; full font acceptance BLOCKED by absent SimHei. Strict rejection verified.'
              "$mode : runtime passed; missing-font guard passed; full font acceptance BLOCKED (SimHei absent)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          $bad = Join-Path $env:RUNNER_TEMP 'hetong-win11-invalid'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .agents\skills\hetong-craft\scripts\setup_windows.ps1 -PythonExecutable $python -CheckOnly -LibreOfficeExecutable 'C:\does-not-exist\soffice.exe' -OutputDirectory $bad
          if ($LASTEXITCODE -eq 0) { throw 'Invalid LibreOffice path must fail' }
          $invalid = Get-Content -Raw -LiteralPath (Join-Path $bad 'setup-result.json') | ConvertFrom-Json
          if ($invalid.ok -or $invalid.setup_performed -or $invalid.error -notlike '*LibreOffice*') { throw 'Invalid-path receipt did not identify LibreOffice' }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-office-evidence
          path: ${{ runner.temp }}/hetong-win11-*
